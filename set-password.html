<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password | Bless This Home</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="shell" style="max-width:720px; padding-top:40px;">
    <section class="panel">
      <h1>Set Your Password</h1>
      <p class="hint">Finish setting up your account below.</p>

      <div class="formGrid">
        <input id="newPassword" type="password" placeholder="New password" />
        <input id="confirmPassword" type="password" placeholder="Confirm password" />
      </div>

      <div class="actions">
        <button class="btn btnPrimary" id="setPasswordBtn" type="button">Set Password</button>
      </div>

      <div class="hint" id="setPasswordStatus">Waiting.</div>
    </section>
  </main>

 <script type="module">
  import { supabase } from "./supabase-config.js";

  const statusEl =
    document.getElementById(
      "setPasswordStatus"
    );

  const button =
    document.getElementById(
      "setPasswordBtn"
    );

  const passwordInput =
    document.getElementById(
      "newPassword"
    );

  const confirmInput =
    document.getElementById(
      "confirmPassword"
    );

  function setStatus(message) {
    statusEl.textContent =
      message || "";
  }

  function disableForm(disabled) {
    button.disabled = disabled;
    passwordInput.disabled = disabled;
    confirmInput.disabled = disabled;
  }

  async function prepareRecoveryPage() {
    setStatus(
      "Checking password reset link…"
    );

    /*
     * Supabase reads the recovery information from the URL
     * and restores the temporary recovery session.
     */
    const {
      data: sessionData,
      error: sessionError
    } =
      await supabase.auth.getSession();

    if (sessionError) {
      disableForm(true);

      setStatus(
        sessionError.message ||
          "The password reset link could not be verified."
      );

      return;
    }

    if (sessionData.session) {
      disableForm(false);

      setStatus(
        "Enter your new password."
      );

      return;
    }

    /*
     * The recovery event can arrive shortly after page load,
     * so listen for it before declaring the link invalid.
     */
    const {
      data: authListener
    } =
      supabase.auth.onAuthStateChange(
        (event, session) => {
          if (
            event ===
              "PASSWORD_RECOVERY" ||
            (
              event === "SIGNED_IN" &&
              session
            )
          ) {
            disableForm(false);

            setStatus(
              "Enter your new password."
            );
          }
        }
      );

    window.setTimeout(async () => {
      const {
        data: retryData
      } =
        await supabase.auth.getSession();

      if (!retryData.session) {
        disableForm(true);

        setStatus(
          "This password reset link is invalid or has expired. Request a new reset email."
        );

        authListener.subscription
          .unsubscribe();
      }
    }, 2500);
  }

  button.addEventListener(
    "click",
    async () => {
      const password =
        passwordInput.value;

      const confirmation =
        confirmInput.value;

      if (
        !password ||
        !confirmation
      ) {
        setStatus(
          "Enter both password fields."
        );

        return;
      }

      if (password.length < 8) {
        setStatus(
          "Password must contain at least 8 characters."
        );

        return;
      }

      if (
        password !== confirmation
      ) {
        setStatus(
          "Passwords do not match."
        );

        return;
      }

      try {
        disableForm(true);

        setStatus(
          "Updating password…"
        );

        const { error } =
          await supabase.auth
            .updateUser({
              password
            });

        if (error) {
          throw error;
        }

        setStatus(
          "Password updated successfully. Redirecting to sign in…"
        );

        /*
         * Sign out of the temporary recovery session so the
         * user performs a clean sign-in with the new password.
         */
        await supabase.auth.signOut();

        window.setTimeout(() => {
          window.location.href =
            "./volunteer-hub/";
        }, 1000);
      } catch (error) {
        disableForm(false);

        setStatus(
          error.message ||
            "Unable to update the password."
        );
      }
    }
  );

  disableForm(true);
  prepareRecoveryPage();
</script>
</body>
</html>
