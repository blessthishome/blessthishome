<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f2e8"
  >

  <meta
    name="description"
    content="Reset your Bless This Home Volunteer Hub password"
  >

  <title>
    Reset Password | Bless This Home Volunteer Hub
  </title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/branding/favicon.png"
  >

  <link
    rel="stylesheet"
    href="./css/app.css"
  >

  <link
    rel="stylesheet"
    href="./css/responsive.css"
  >

  <style>
    .password-reset-shell {
      display: grid;
      place-items: center;
      width: min(100% - 2rem, 620px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        calc(1.5rem + env(safe-area-inset-top))
        0
        calc(1.5rem + env(safe-area-inset-bottom));
    }

    .password-reset-card {
      display: grid;
      width: 100%;
      gap: 1rem;
      padding: clamp(1.1rem, 4vw, 1.75rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-large);
      background: var(--paper);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(12px);
    }

    .password-reset-brand {
      display: grid;
      justify-items: center;
      gap: 0.85rem;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .password-reset-brand img {
      width: min(245px, 70%);
      height: auto;
      object-fit: contain;
    }

    .password-reset-brand h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.9rem, 7vw, 2.6rem);
    }

    .password-reset-brand p {
      max-width: 480px;
      margin-bottom: 0;
      color: var(--muted);
    }

    .password-reset-form {
      display: grid;
      gap: 1rem;
    }

    .password-reset-status {
      min-height: 1.4rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .password-reset-status.is-error {
      color: var(--danger);
    }

    .password-reset-status.is-success {
      color: var(--success);
    }

    .password-reset-actions {
      display: grid;
      gap: 0.65rem;
    }

    .password-reset-link {
      justify-self: center;
    }

    @media (max-width: 680px) {
      .password-reset-shell {
        width: min(100% - 1rem, 620px);
      }

      .password-reset-card {
        padding: 1rem;
        border-radius: 20px;
      }

      .password-reset-actions .button {
        width: 100%;
      }
    }
  </style>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    defer
    src="./js/config.js"
  ></script>
</head>

<body>
  <div
    class="page-background"
    aria-hidden="true"
  ></div>

  <main class="password-reset-shell">
    <section
      class="password-reset-card"
      aria-labelledby="passwordResetHeading"
    >
      <header class="password-reset-brand">
        <img
          src="./assets/branding/logo.png"
          alt="Bless This Home"
        >

        <div>
          <p class="eyebrow">
            Volunteer Hub
          </p>

          <h1 id="passwordResetHeading">
            Set a new password
          </h1>

          <p>
            Enter a new password for your Volunteer Hub account.
          </p>
        </div>
      </header>

      <form
        id="passwordResetForm"
        class="password-reset-form"
        novalidate
      >
        <label class="field">
          <span>New password</span>

          <input
            id="newPassword"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <label class="field">
          <span>Confirm new password</span>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <div class="password-reset-actions">
          <button
            id="setPasswordButton"
            class="button button-primary button-full"
            type="submit"
            disabled
          >
            Set new password
          </button>

          <button
            id="returnToSignInButton"
            class="text-button password-reset-link"
            type="button"
          >
            Return to sign in
          </button>
        </div>

        <p
          id="passwordResetStatus"
          class="password-reset-status"
          role="status"
          aria-live="polite"
        >
          Checking password reset link…
        </p>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        "use strict";

        const form =
          document.getElementById(
            "passwordResetForm"
          );

        const passwordInput =
          document.getElementById(
            "newPassword"
          );

        const confirmInput =
          document.getElementById(
            "confirmPassword"
          );

        const submitButton =
          document.getElementById(
            "setPasswordButton"
          );

        const returnButton =
          document.getElementById(
            "returnToSignInButton"
          );

        const statusElement =
          document.getElementById(
            "passwordResetStatus"
          );

        let recoveryReady = false;

        function setStatus(
          message,
          type = ""
        ) {
          statusElement.textContent =
            message || "";

          statusElement.classList.toggle(
            "is-error",
            type === "error"
          );

          statusElement.classList.toggle(
            "is-success",
            type === "success"
          );
        }

        function setFormEnabled(
          enabled
        ) {
          recoveryReady = enabled;

          passwordInput.disabled =
            !enabled;

          confirmInput.disabled =
            !enabled;

          submitButton.disabled =
            !enabled;
        }

        function returnToSignIn() {
          window.location.replace("./");
        }

        returnButton.addEventListener(
          "click",
          returnToSignIn
        );

        if (
          !window.BTH_CONFIG ||
          !window.supabase ||
          typeof window.supabase
            .createClient !== "function"
        ) {
          setFormEnabled(false);

          setStatus(
            "The Volunteer Hub could not initialize. Please return to sign in and request a new password reset link.",
            "error"
          );

          return;
        }

        const config =
          window.BTH_CONFIG;

        if (
          !config.supabaseUrl ||
          !config.supabaseAnonKey
        ) {
          setFormEnabled(false);

          setStatus(
            "The Volunteer Hub database configuration is unavailable.",
            "error"
          );

          return;
        }

        const supabase =
          window.supabase.createClient(
            config.supabaseUrl,
            config.supabaseAnonKey,
            {
              auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
              }
            }
          );

        function allowPasswordReset() {
          setFormEnabled(true);

          setStatus(
            "Reset link verified. Enter your new password."
          );

          passwordInput.focus();
        }

        function rejectPasswordReset() {
          setFormEnabled(false);

          setStatus(
            "This password reset link is invalid or has expired. Return to sign in and request a new reset email.",
            "error"
          );
        }

        /*
         * Some Supabase authentication configurations
         * return a ?code= value instead of a URL hash.
         *
         * If one exists, exchange it for the temporary
         * recovery session before checking the session.
         */
        async function exchangeCodeIfNeeded() {
          const url =
            new URL(
              window.location.href
            );

          const code =
            url.searchParams.get(
              "code"
            );

          if (!code) {
            return;
          }

          const {
            error
          } =
            await supabase.auth
              .exchangeCodeForSession(
                code
              );

          if (error) {
            throw error;
          }

          /*
           * Remove the temporary authorization code
           * from the visible URL after it has been used.
           */
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );
        }

        /*
         * Listen for the recovery event immediately.
         *
         * Supabase may process the reset token during
         * client initialization, so this gives both
         * implicit and PKCE-style recovery links a
         * chance to complete.
         */
        const {
          data: authListener
        } =
          supabase.auth.onAuthStateChange(
            (event, session) => {
              if (
                event ===
                  "PASSWORD_RECOVERY" &&
                session
              ) {
                allowPasswordReset();
              }
            }
          );

        try {
          setFormEnabled(false);

          setStatus(
            "Checking password reset link…"
          );

          await exchangeCodeIfNeeded();

          const {
            data,
            error
          } =
            await supabase.auth
              .getSession();

          if (error) {
            throw error;
          }

          if (data.session) {
            allowPasswordReset();
          } else {
            /*
             * URL token processing can finish shortly
             * after the DOM is ready on some browsers.
             */
            window.setTimeout(
              async () => {
                if (recoveryReady) {
                  return;
                }

                try {
                  const {
                    data: retryData
                  } =
                    await supabase.auth
                      .getSession();

                  if (
                    retryData.session
                  ) {
                    allowPasswordReset();
                  } else {
                    rejectPasswordReset();
                  }
                } catch (error) {
                  console.error(
                    "Recovery session retry failed:",
                    error
                  );

                  rejectPasswordReset();
                }
              },
              1800
            );
          }
        } catch (error) {
          console.error(
            "Password recovery initialization failed:",
            error
          );

          rejectPasswordReset();
        }

        form.addEventListener(
          "submit",
          async (event) => {
            event.preventDefault();

            if (!recoveryReady) {
              setStatus(
                "The password reset link has not been verified.",
                "error"
              );

              return;
            }

            const password =
              passwordInput.value;

            const confirmation =
              confirmInput.value;

            if (
              !password ||
              !confirmation
            ) {
              setStatus(
                "Enter both password fields.",
                "error"
              );

              return;
            }

            if (
              password.length < 8
            ) {
              setStatus(
                "Password must contain at least 8 characters.",
                "error"
              );

              return;
            }

            if (
              password !==
              confirmation
            ) {
              setStatus(
                "Passwords do not match.",
                "error"
              );

              return;
            }

            try {
              submitButton.disabled =
                true;

              passwordInput.disabled =
                true;

              confirmInput.disabled =
                true;

              setStatus(
                "Updating your password…"
              );

              const {
                error
              } =
                await supabase.auth
                  .updateUser({
                    password
                  });

              if (error) {
                throw error;
              }

              /*
               * End the temporary recovery session.
               *
               * The user will perform a clean normal
               * sign-in with the new password.
               */
              await supabase.auth.signOut();

              recoveryReady = false;

              setStatus(
                "Password updated successfully. Returning to sign in…",
                "success"
              );

              window.setTimeout(
                () => {
                  returnToSignIn();
                },
                1200
              );
            } catch (error) {
              console.error(
                "Password update failed:",
                error
              );

              passwordInput.disabled =
                false;

              confirmInput.disabled =
                false;

              submitButton.disabled =
                false;

              setStatus(
                error.message ||
                  "Unable to update your password. Please try again.",
                "error"
              );
            }
          }
        );

        window.addEventListener(
          "pagehide",
          () => {
            authListener
              ?.subscription
              ?.unsubscribe();
          },
          {
            once: true
          }
        );
      },
      {
        once: true
      }
    );
  </script>
</body>
</html>
